services:
  chat:
    build: .
    image: ctf-slack-clone:latest
    ports:
      - "3000:3000"
    environment:
      # AI provider keys for persona auto-replies. Set ONE (or both — see
      # LLM_PROVIDER below). Leave unset to keep bots silent unless driven
      # by scenarios or the facilitator console.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Optional override when both keys are set: anthropic | gemini
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      # Token for /admin facilitator console. CHANGE THIS for any real event.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-changeme-admin}
      # Default workspace name shown to users.
      - DEFAULT_WORKSPACE_NAME=${DEFAULT_WORKSPACE_NAME:-CTF Workspace}
      # Model for persona replies. Default depends on provider:
      # - anthropic → claude-haiku-4-5-20251001
      # - gemini    → gemini-2.5-flash
      - PERSONA_MODEL=${PERSONA_MODEL:-}
      # Optional defaults for the GitHub scenarios sync form. PAT can also be
      # entered in the UI (and is then session-only, never written to disk).
      - SCENARIO_REPO=${SCENARIO_REPO:-}
      - SCENARIO_REPO_REF=${SCENARIO_REPO_REF:-main}
      - SCENARIO_REPO_PATH=${SCENARIO_REPO_PATH:-scenarios}
      - SCENARIO_REPO_TOKEN=${SCENARIO_REPO_TOKEN:-}
      # Single-event mode (one Cloud Run service per event). Setting these
      # binds this container to one cohort, opens the /register page, and
      # enables auto sign-in via /?u=<id>&n=<displayName>.
      - AUTO_SIGNIN_MODE=${AUTO_SIGNIN_MODE:-}
      - EVENT_INVITE_ID=${EVENT_INVITE_ID:-}
      - EVENT_SCENARIO_ID=${EVENT_SCENARIO_ID:-}
      - EVENT_COHORT_NAME=${EVENT_COHORT_NAME:-}
      - EVENT_ADMIN_MODE=${EVENT_ADMIN_MODE:-}
    volumes:
      - chat-data:/data
    restart: unless-stopped

volumes:
  chat-data:
