<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/slack.css" />
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" title="History"><svg viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M7.05 4.05a1 1 0 011.41 1.41L4.92 9h11.59a1 1 0 010 2H4.92l3.54 3.54a1 1 0 01-1.41 1.41L1.6 10.7a1 1 0 010-1.41l5.45-5.24z"/></svg></button>
        <button class="icon-btn" title="Forward"><svg viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M12.95 4.05a1 1 0 00-1.41 1.41L15.08 9H3.5a1 1 0 100 2h11.58l-3.54 3.54a1 1 0 001.41 1.41l5.45-5.24a1 1 0 000-1.42z"/></svg></button>
      </div>
      <div class="topbar-search">
        <input id="search" type="search" placeholder="Search" />
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="logout" title="Sign out">Sign out</button>
      </div>
    </header>

    <!-- Workspace rail -->
    <aside class="rail">
      <div class="rail-workspace" id="rail-ws" title="Workspace">W</div>
    </aside>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="ws-name" id="ws-name">Workspace</div>
        <div class="ws-user"><span class="presence-dot online"></span><span id="me-name">me</span></div>
      </div>

      <nav class="sidebar-section">
        <div class="section-title">
          <span>Channels</span>
          <button class="add-btn" id="add-channel" title="Add channel">+</button>
        </div>
        <ul id="channel-list" class="nav-list"></ul>
      </nav>

      <nav class="sidebar-section">
        <div class="section-title">
          <span>Direct messages</span>
        </div>
        <ul id="dm-list" class="nav-list"></ul>
      </nav>

      <nav class="sidebar-section">
        <div class="section-title">
          <span>People</span>
        </div>
        <ul id="people-list" class="nav-list"></ul>
      </nav>
    </aside>

    <!-- Main pane -->
    <main class="main">
      <div class="main-channel">
        <div class="channel-header">
          <div class="channel-title">
            <span class="hash">#</span><span id="channel-name">general</span>
          </div>
          <div class="channel-topic" id="channel-topic"></div>
        </div>

        <div class="messages-wrap">
          <div id="messages" class="messages" tabindex="0"></div>
          <div id="typing-indicator" class="typing-indicator"></div>
        </div>

        <div class="composer">
          <div class="composer-toolbar">
            <button class="composer-btn" title="Bold"><b>B</b></button>
            <button class="composer-btn" title="Italic"><i>I</i></button>
            <button class="composer-btn" title="Strikethrough"><s>S</s></button>
            <span class="divider"></span>
            <button class="composer-btn" title="Code">{ }</button>
            <button class="composer-btn" title="Link">🔗</button>
            <button class="composer-btn" title="Bulleted list">•</button>
            <button class="composer-btn" id="composer-emoji" title="Emoji">😀</button>
          </div>
          <div class="composer-input-row">
            <textarea id="composer-input" placeholder="Message" rows="1"></textarea>
            <button id="send-btn" class="send-btn" title="Send">
              <svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M2.5 17.5l15-7.5-15-7.5v6l10 1.5-10 1.5z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Thread panel -->
      <aside class="thread-panel" id="thread-panel" hidden>
        <div class="thread-header">
          <div>
            <div class="thread-title">Thread</div>
            <div class="thread-subtitle" id="thread-subtitle"></div>
          </div>
          <button class="icon-btn dark" id="thread-close" title="Close thread">✕</button>
        </div>
        <div class="thread-body">
          <div class="thread-root" id="thread-root"></div>
          <div class="thread-replies-divider" id="thread-replies-divider" hidden>
            <span id="thread-replies-count">0 replies</span>
          </div>
          <div id="thread-replies" class="thread-replies"></div>
        </div>
        <div class="composer thread-composer">
          <div class="composer-toolbar">
            <button class="composer-btn" id="thread-emoji" title="Emoji">😀</button>
          </div>
          <div class="composer-input-row">
            <textarea id="thread-input" placeholder="Reply..." rows="1"></textarea>
            <button id="thread-send-btn" class="send-btn" title="Reply">
              <svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M2.5 17.5l15-7.5-15-7.5v6l10 1.5-10 1.5z"/></svg>
            </button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Emoji picker (positioned dynamically) -->
  <div class="emoji-picker" id="emoji-picker" hidden>
    <input id="emoji-search" placeholder="Search :emoji:" autocomplete="off" />
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>

  <!-- Add channel modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal">
      <h2>Create a channel</h2>
      <form id="create-channel-form">
        <label>
          <span>Name</span>
          <input name="name" required pattern="[a-z0-9-]{2,40}" placeholder="e.g. project-phoenix" />
        </label>
        <label>
          <span>Topic (optional)</span>
          <input name="topic" placeholder="What is this channel about?" />
        </label>
        <div class="modal-actions">
          <button type="button" class="ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="primary">Create</button>
        </div>
        <p class="error" id="modal-error"></p>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/emojis.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
